<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="メール">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2c2c2e" media="(prefers-color-scheme: dark)">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
addEventListener("error", function(e){
  var b = document.getElementById("banner");
  if(!b) return;
  b.textContent = "読み込みエラー: " + ((e && e.message) || "不明") + (e && e.lineno ? "（" + e.lineno + "行目）" : "");
  b.className = "banner on";
});
addEventListener("unhandledrejection", function(e){
  var b = document.getElementById("banner");
  if(!b) return;
  b.textContent = "処理エラー: " + String((e && e.reason && e.reason.message) || e.reason || "不明");
  b.className = "banner on";
});
</script>
<title>メール</title>
<style>
:root{--fs:1;
  --accent:#007aff;--accent-press:#0062cc;--sidebar-bg:#f0eff2;--pane-bg:#ffffff;
  --toolbar-bg:#f6f6f6;--hairline:rgba(0,0,0,.10);--hairline-soft:rgba(0,0,0,.06);
  --fill:rgba(0,0,0,.055);--text:#000;--text-2:rgba(0,0,0,.55);--text-3:rgba(0,0,0,.38);
  --sel-inactive:rgba(0,0,0,.075);--seg-on:#fff;--row-h:74px;--sidebar-w:212px;--list-w:340px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --accent:#0a84ff;--accent-press:#3d9bff;--sidebar-bg:#26262a;--pane-bg:#1e1e1e;--toolbar-bg:#2c2c2e;
  --hairline:rgba(255,255,255,.14);--hairline-soft:rgba(255,255,255,.08);--fill:rgba(255,255,255,.09);
  --text:#fff;--text-2:rgba(255,255,255,.6);--text-3:rgba(255,255,255,.4);
  --sel-inactive:rgba(255,255,255,.10);--seg-on:#5a5a5f;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}   /* display:flex などに負けないように */
html,body{height:100%;margin:0}
@supports (height:100dvh){html,body{height:100dvh}}
body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--pane-bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iOS は 16px 未満の入力欄に触れると自動でズームする。タッチ端末では 16px に上げて止める。 */
@media (hover:none){
  input,textarea,select{font-size:16px !important}
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.icon{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#shell{display:flex;flex-direction:column;height:100%;overflow-x:hidden;max-width:100%}
#app{flex:1;min-height:0;min-width:0;display:flex;overflow-x:hidden}

#sidebar{width:var(--sidebar-w);flex:0 0 auto;background:var(--sidebar-bg);border-right:1px solid var(--hairline);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.sb-top{height:52px;flex:0 0 auto;display:flex;align-items:center;padding:0 14px}
.sb-title{font-size:13px;font-weight:700}
.sb-scroll{flex:1;overflow-y:auto;padding:2px 8px 14px}
.sb-head{font-size:11px;font-weight:600;color:var(--text-3);padding:12px 8px 4px;word-break:break-all}
.sb-item{display:flex;align-items:center;gap:8px;width:100%;height:26px;padding:0 8px;border-radius:6px;text-align:left}
.sb-item .icon{color:var(--accent);width:15px;height:15px}
.sb-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item .cnt{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.sb-item:hover{background:var(--hairline-soft)}
.sb-item[aria-current="true"]{background:var(--sel-inactive);font-weight:600}

#list{width:var(--list-w);flex:0 0 auto;min-width:0;max-width:100%;background:var(--pane-bg);border-right:1px solid var(--hairline);display:flex;flex-direction:column;overflow-x:hidden}
.pane-top{height:52px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;min-width:0;max-width:100%;background:var(--toolbar-bg);border-bottom:1px solid var(--hairline);padding-top:env(safe-area-inset-top)}
.tb-btn{width:30px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.tb-btn:hover{background:var(--hairline-soft);color:var(--text)}
.tb-btn[disabled]{opacity:.3;cursor:default;background:none}
.tb-spacer{flex:1}
.search{display:flex;align-items:center;gap:5px;flex:1;height:24px;padding:0 7px;border-radius:6px;background:var(--fill);color:var(--text-2)}
.search input{flex:1;border:0;background:none;outline:none;font-size:12px;min-width:0}
.search .icon{width:13px;height:13px}
.list-scroll{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.filters{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:7px;padding:8px 12px;
  border-bottom:1px solid var(--hairline);background:var(--pane-bg)}
.filters .chip{flex:0 0 auto;touch-action:manipulation}
.filters .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pull{flex:0 0 auto;display:flex;align-items:center;justify-content:center;height:30px;
  font-size:12px;color:var(--text-3);background:var(--pane-bg)}
.bulk{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid var(--hairline);
  background:var(--fill);font-size:12px;color:var(--text-2)}
.chip.danger{color:#d70015;border-color:rgba(215,0,21,.35)}

.row-done:hover::before{border-color:var(--accent)}
.row-done:hover{color:var(--accent)}
.row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;width:100%;max-width:100%;min-height:var(--row-h);
  padding:9px 0 10px 6px;border-bottom:1px solid var(--hairline-soft);text-align:left;align-items:start;overflow:hidden}
.row > span:nth-child(2){padding-right:14px}
.row .row-done,.row .pick{align-self:stretch}
.row span{min-width:0;max-width:100%}
.row .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin:5px 0 0 3px;visibility:hidden}
.row.unread .dot{visibility:visible}
.row .r1{display:flex;align-items:baseline;gap:8px}
.row .from{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .from{font-weight:700}
.row .date{font-size:11px;color:var(--text-3);flex:0 0 auto;font-variant-numeric:tabular-nums}
.row .subj{font-size:13px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .prev{font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row:hover{background:var(--hairline-soft)}
.row[aria-selected="true"],.row[aria-selected="true"]:hover{background:var(--accent)}
.row[aria-selected="true"] .from,.row[aria-selected="true"] .subj{color:#fff}
.row[aria-selected="true"] .date,.row[aria-selected="true"] .prev{color:rgba(255,255,255,.82)}
.row[aria-selected="true"] .dot{background:#fff}

#reader{flex:1;min-width:0;max-width:100%;display:flex;flex-direction:column;background:var(--pane-bg);overflow-x:hidden}
.rd-scroll{flex:1;overflow-y:auto;padding-bottom:8px}
.rd-head{padding:20px 28px 14px;border-bottom:1px solid var(--hairline-soft)}
.rd-subj{font-size:17px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.rd-meta{display:flex;align-items:center;gap:10px;margin-top:14px}
.avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.rd-who{flex:1;min-width:0}
.rd-name{font-size:13px;font-weight:600}
.rd-to{font-size:12px;color:var(--text-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-date{font-size:12px;color:var(--text-2);flex:0 0 auto;white-space:nowrap}
.rd-body{padding:16px 28px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-width:760px}
.rd-sep{margin:0 28px;border-top:1px dashed var(--hairline);padding-top:4px}
.rd-older{margin:18px 28px 0;padding-top:10px;border-top:1px solid var(--hairline);font-size:11px;font-weight:600;color:var(--text-3)}
.rd-snippet{padding:2px 28px 12px;font-size:12.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quote-toggle{margin:0 28px 12px;height:24px;padding:0 11px;border:1px solid var(--hairline);border-radius:12px;font-size:12px;color:var(--text-2);background:var(--fill)}
.quote-toggle:hover{color:var(--text)}
.rd-quote{margin:0 28px 16px;padding:2px 0 2px 12px;border-left:2px solid var(--hairline);font-size:12.5px;line-height:1.5;white-space:pre-wrap;color:var(--text-2);overflow-wrap:anywhere;max-width:760px}
button.rd-meta{background:none;border:0;padding:0;cursor:pointer}
button.rd-meta:hover .rd-to{color:var(--accent)}

.ai-bar{flex:0 0 auto;border-top:1px solid var(--hairline);background:var(--toolbar-bg);padding:11px 20px 13px}
.ai-lbl{font-size:11px;font-weight:600;color:var(--text-3);margin-bottom:8px}
.ai-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap;min-width:0}
.ai-head .ai-lbl{margin:0}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{height:27px;padding:0 12px;border-radius:14px;background:var(--pane-bg);border:1px solid var(--hairline);font-size:12px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:5px}
.chip:hover{background:var(--hairline-soft)}
.chip.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.primary:hover{background:var(--accent-press)}
.chip .icon{width:13px;height:13px}
.drafts{padding:14px 28px 2px;max-width:760px}
.drafts:empty{padding:0}
.draft{border:1px solid var(--hairline);border-radius:10px;padding:13px 15px;margin-bottom:9px}
.draft-h{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.draft-tag{font-size:10.5px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:1px 5px}
.draft-use{font-size:12px;font-weight:600;color:var(--accent)}
.draft-body{font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.thinking{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);padding:6px 0}
.spin{width:13px;height:13px;border-radius:50%;flex:0 0 auto;border:1.8px solid var(--hairline);border-top-color:var(--accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:var(--text-3);padding:40px;text-align:center}
.empty .icon{width:38px;height:38px;stroke-width:1.1}
.empty .t{font-size:15px;color:var(--text-2);font-weight:500}
.empty .s{font-size:12.5px;max-width:300px;line-height:1.6}

#dock{flex:0 0 auto;background:var(--toolbar-bg);border-top:1px solid var(--hairline);padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.dk-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.seg{display:flex;background:var(--fill);border-radius:7px;padding:2px;gap:2px}
.seg button{height:22px;padding:0 9px;border-radius:5px;font-size:12px;font-weight:500;color:var(--text-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.06)}
.dk-in{width:100%;resize:none;border:1px solid var(--hairline);border-radius:10px;background:var(--pane-bg);padding:11px 13px;font-size:14px;line-height:1.5;min-height:120px;max-height:46vh;outline:none;-webkit-appearance:none}
.dk-in:focus{border-color:var(--accent)}
.dk-go{height:34px;padding:0 18px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.dk-go:hover{background:var(--accent-press)}
.dk-go[disabled]{opacity:.45;cursor:default}
.dk-hint{font-size:11px;color:var(--text-3);line-height:1.5;flex:1;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.16);display:none;z-index:40}
.scrim.on{display:block}
.compose,.sheet{position:fixed;z-index:50;display:none;flex-direction:column;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--pane-bg);border-radius:11px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.16)}
.compose{width:min(680px,calc(100vw - 28px));height:min(600px,calc(100vh - 60px))}
.sheet{width:min(560px,calc(100vw - 28px));max-height:min(640px,calc(100vh - 60px))}
.compose.on,.sheet.on{display:flex}
.cp-top{height:48px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--toolbar-bg);border-bottom:1px solid var(--hairline)}
.cp-title{flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--text-2)}
.cp-send{width:30px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.cp-send:hover{background:var(--hairline-soft)}
.cp-field{display:flex;align-items:center;gap:8px;padding:0 16px;height:34px;border-bottom:1px solid var(--hairline-soft)}
.cp-field .k{width:44px;flex:0 0 auto;font-size:12.5px;color:var(--text-2)}
.cp-field input{flex:1;border:0;outline:none;background:none;font-size:13px;min-width:0}
.cp-body{flex:1;border:0;outline:none;resize:none;padding:16px;font-size:13.5px;line-height:1.55;background:none}
.cp-foot{flex:0 0 auto;border-top:1px solid var(--hairline);background:var(--toolbar-bg);padding:9px 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cp-hint{font-size:11px;color:var(--text-3)}
.files{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;border-bottom:1px solid var(--hairline-soft)}
.file{display:flex;align-items:center;gap:6px;max-width:100%;height:26px;padding:0 10px;border-radius:13px;
  background:var(--fill);font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .x{color:var(--text-3);font-weight:700}
.file:hover .x{color:#d70015}
.att{margin:0 28px 14px;display:flex;flex-wrap:wrap;gap:7px}
.att button{display:flex;align-items:center;gap:6px;max-width:100%;height:30px;padding:0 12px;border-radius:15px;
  border:1px solid var(--hairline);background:var(--fill);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button:hover{border-color:var(--accent);color:var(--accent)}
.more{display:block;width:calc(100% - 24px);margin:10px 12px 18px;height:34px;border-radius:8px;
  border:1px solid var(--hairline);font-size:13px;color:var(--text-2)}
.more:hover{background:var(--hairline-soft);color:var(--text)}
.sh-scroll{overflow-y:auto;padding:6px 20px 20px}
.sh-sec{font-size:11px;font-weight:600;color:var(--text-3);margin:18px 0 7px}
.sh-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hairline-soft)}
.sh-row .k{flex:1;min-width:0}
.sh-row .k .n{font-size:13px;font-weight:500}
.sh-row .k .d{font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.55;white-space:pre-wrap}
.sh-in{width:100%;padding:6px 9px;border:1px solid var(--hairline);border-radius:6px;background:none;outline:none;font-size:12.5px;line-height:1.6}
.sh-in:focus{border-color:var(--accent)}
.sh-btn{height:26px;padding:0 12px;border-radius:6px;border:1px solid var(--hairline);font-size:12px;font-weight:500;white-space:nowrap}
.sh-btn:hover{background:var(--hairline-soft)}
.sh-btn.danger{color:#d70015;border-color:rgba(215,0,21,.35)}
.sh-btn.danger.armed{background:#d70015;border-color:#d70015;color:#fff}
.status{font-size:12px;color:var(--text-2);padding:8px 0 0;line-height:1.55}
.sig-box{margin-top:7px;padding:10px 12px;border:1px solid var(--hairline);border-radius:8px;background:var(--fill);font-size:12.5px;line-height:1.7;white-space:pre-wrap}
.bn-btn{margin-left:10px;height:28px;padding:0 12px;border-radius:14px;border:1px solid currentColor;
  font-size:12px;color:inherit;background:none;touch-action:manipulation}
.bn-btn:active{opacity:.6}
.banner{padding:7px 16px;font-size:12px;background:#fff4d6;color:#6b4e00;border-bottom:1px solid var(--hairline);display:none}
.banner.on{display:block}
@media (prefers-color-scheme:dark){.banner{background:#3a2f10;color:#f0d78a}}
.back-btn{display:none}
@media (max-width:860px){
  #sidebar{display:none}
  #list{width:100%;border-right:0}
  #reader{display:none}
  body.reading #list{display:none}
  body.reading #reader{display:flex}
  .back-btn{display:flex}
  .rd-head,.rd-body,.drafts,.rd-snippet{padding-left:18px;padding-right:18px}
  .rd-older,.quote-toggle,.rd-quote{margin-left:18px;margin-right:18px}
  .rd-sep{margin:0 18px}
  .ai-bar,#dock{padding-left:13px;padding-right:13px}
}

/* ---- タップ目標を大きくする（iOS の目安は44px） ---- */
.tb-btn{width:42px;height:42px}
.tb-btn .icon{width:22px;height:22px}
.chip{height:36px;padding:0 14px;font-size:13px}
.dk-go{height:44px;padding:0 18px;font-size:14px}
.draft-act button{height:38px;padding:0 16px;font-size:13.5px}
.sh-btn{height:36px;padding:0 14px;font-size:13px}
.row{min-height:76px;padding-top:12px;padding-bottom:13px}
.row:not(:has(.row-done)):not(:has(.pick)) > span:nth-child(2){padding-right:14px}
.row-done,.pick{position:relative;width:58px;min-height:58px;margin:0;padding:0;
  align-self:stretch;border:0;border-radius:0;background:none;
  display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.row-done::before,.pick::before{content:"";position:absolute;width:30px;height:30px;
  border-radius:50%;border:1.5px solid var(--hairline)}
.row-done:active::before,.pick:active::before{background:var(--hairline-soft)}
.pick[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.row-done .icon,.pick .icon{position:relative;width:16px;height:16px}
.row-done{color:var(--text-3)}
.pick{color:transparent}
.pick[aria-pressed="true"]{color:#fff}
.more{height:44px;font-size:14px}
.att button{height:38px;padding:0 14px;font-size:13px}
.quote-toggle{height:32px;padding:0 14px}
.seg button{height:32px;padding:0 13px;font-size:12.5px}
.file{height:32px;padding:0 12px;font-size:12.5px}
@media (hover:none){
  .tb-btn{width:46px;height:46px}
  .chip{height:38px}
  .row{min-height:80px}
}

/* ---- 更新中の表示 ---- */
.rdbusy{display:flex;align-items:center;gap:6px;margin-left:6px;font-size:12px;color:var(--text-3);white-space:nowrap}
.rdbusy .spin{width:13px;height:13px}
.busy{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);margin-left:auto}
.busy .spin{width:13px;height:13px}

/* ---- 返信中に元のメールを見る ---- */
.cp-quote{border-top:1px solid var(--hairline);background:var(--fill)}
.cp-quote summary{padding:11px 16px;font-size:12.5px;color:var(--text-2);cursor:pointer;list-style:none}
.cp-quote summary::-webkit-details-marker{display:none}
.cp-quote summary::before{content:"▸ ";color:var(--text-3)}
.cp-quote[open] summary::before{content:"▾ "}
.cp-quote .q{max-height:38vh;overflow:auto;padding:0 16px 14px;font-size:12.5px;line-height:1.55;
  white-space:pre-wrap;color:var(--text-2);overflow-wrap:anywhere}

/* ---- 文字の大きさ。設定の「文字の大きさ」で --fs が変わる ---- */
.row .from{font-size:calc(15px * var(--fs));font-weight:600}
.row .subj{font-size:calc(14px * var(--fs))}
.row .prev{font-size:calc(13px * var(--fs));line-height:1.45}
.row .date{font-size:calc(12.5px * var(--fs))}
.rep{display:inline-block;margin-right:5px;color:var(--accent);font-weight:700}
.rd-subj{font-size:calc(19px * var(--fs));line-height:1.35}
.rd-name{font-size:calc(15px * var(--fs))}
.rd-to,.rd-date{font-size:calc(12.5px * var(--fs))}
.rd-body{font-size:calc(15px * var(--fs));line-height:1.7}
.rd-snippet{font-size:calc(13px * var(--fs))}
.rd-quote{font-size:calc(13px * var(--fs));line-height:1.6}
.draft-body{font-size:calc(14.5px * var(--fs));line-height:1.65}
.cp-body{font-size:calc(15.5px * var(--fs));line-height:1.65}
.cp-field input{font-size:calc(15.5px * var(--fs))}
.dk-in{font-size:calc(15.5px * var(--fs))}
.chip{font-size:calc(13px * var(--fs))}
.sh-row .n{font-size:calc(14px * var(--fs))}
.sh-row .d{font-size:calc(12.5px * var(--fs))}
.empty .t{font-size:calc(15px * var(--fs))}
.empty .s{font-size:calc(13px * var(--fs))}
@media (hover:none){
  .cp-body,.cp-field input,.dk-in{font-size:max(16px, calc(15.5px * var(--fs)))}
}
</style>
</head>
<body>

<div id="shell">
<div class="banner" id="banner"></div>
<div id="app">
  <nav id="sidebar">
    <div class="sb-top"><span class="sb-title">メール</span></div>
    <div class="sb-scroll" id="sbScroll"></div>
  </nav>

  <section id="list">
    <div class="pane-top">

      <div class="search">

      </div>
      <button class="tb-btn" id="btnSettings" title="設定" aria-label="設定">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.5 15H3.3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 8.3l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V4.2a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.8 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.2a2 2 0 1 1 0 4h-.2z"/></svg>

<script>
"use strict";

/* 署名 — 実際に付くのは裏側（Code.gs）の SIGNATURE。ここは表示用の控え。 */
const SIGNATURE = [
  "高崎 晟　Jo Takasaki",
  "（株）アップフロントワークス",
  "UP-FRONT WORKS",
  "",
  "携帯 : 090-9850-3576",
  "Email : j-takasaki@ufg.co.jp"
].join("\n");

const BUILD = "v25";   // 設定の一番下に出る。公開のたびに v2, v3 と上げる。
const ACCOUNT = "j-takasaki@ufg.co.jp";
const VIA     = "j-takasaki@bu.k-cloud90.biz";

/* ---------- 敬語 ---------- */
const LEVELS = {
  weak:  { name:"親しみ",   note:"何度もやり取りしている相手" },
  mid:   { name:"丁寧",     note:"業界内の通常のやり取り" },
  strong:{ name:"ビジネス", note:"初めての会社・面識のない相手" }
};
const LEVEL_ORDER = ["weak","mid","strong"];

/* ============================================================
   文面のルール。ここを直せば GitHub の更新だけで反映される。
   Apps Script 側には文面の知識を一切持たせていない。
   ============================================================ */
const LEVEL_RULE = {
  weak:   "「親しみ」。何度もやり取りしている相手向け。失礼にならない範囲で砕けた調子にする。宛名は「◯◯さま」。感嘆符（！）を使ってよい。堅い言い回しや過剰なクッション言葉は避け、短く言い切る。自分の名前や社名は名乗らない（署名に入るため）。結びは「よろしくお願いします。」",
  mid:    "「丁寧」。音楽業界の実務で日常的にやり取りする相手向け。丁寧だが硬すぎない自然な文面。宛名は「◯◯さま」。過剰な謙譲表現は使わず、必要なところにだけクッション言葉（恐れ入りますが／お手数ですが）を置く。自分の名前や社名は名乗らない（署名に入るため）。結びは「よろしくお願いいたします。」",
  strong: "「ビジネスメール」。初めて仕事をする会社や、面識のない相手向け。最も改まった文面にする。宛名は会社名・部署名から書き「◯◯様」。挨拶のあとに「株式会社アップフロントワークスの高崎晟でございます。」と名乗る。謙譲語と尊敬語を正しく使い分ける（伺う／拝見する／存じます／ご査収）。断定を避け、依頼は「〜いただけますと幸いです」。結びは「何卒よろしくお願い申し上げます。」"
};

const STRUCTURE =
  "日本のビジネスメールの型を守る。宛名 → 挨拶 →（ビジネスメールのみ名乗り）→ 本題 → 結び の順。" +
  "本文は必ず宛名の行から始める。宛名を省略してはならない。" +
  "1文は短く。段落の切れ目では1行だけ空ける。空行を2行以上続けない。意味のつながる文は改行せずに続ける。" +
  "日時・場所・人数・期限などの数値は、読み取れたものだけを書き、勝手に足さない。" +
  "読み取れない項目は本文に含めず、必要なら相手に尋ねる一文にする。";

// 挨拶は文体ではなく相手のドメインで決まる。ufg は社内。
function greetingRule(addr){
  if(addr && /@[^@]*ufg/i.test(addr))
    return "書き出しの挨拶は「お疲れ様です。」にする。「お世話になっております。」は使わない。";
  if(addr)
    return "書き出しの挨拶は「お世話になっております。」にする。「お疲れ様です。」は使わない。";
  return "書き出しの挨拶は、宛先のメールアドレスの @ より後ろに ufg が含まれるなら「お疲れ様です。」、それ以外は「お世話になっております。」にする。";
}

function termsBlock(){
  const t = settings.terms || [];
  if(!t.length) return "";
  return "社内で使っている略称・通称。走り書きや受信メールに左の語が出てきたら、書く本文では右の正式名称に直す。\n" +
    t.map(x => "・" + x.from + " → " + x.to).join("\n");
}

function baseSystem(counterpart){
  return [
    "あなたは日本の音楽制作会社で働く「高崎 晟（たかさき あきら）」本人として、業務メールを書く。",
    "所属は株式会社アップフロントワークス、肩書きは Music Director。",
    LEVEL_RULE[settings.level] || LEVEL_RULE.mid,
    greetingRule(counterpart),
    STRUCTURE,
    "署名は書かない。システム側で固定の署名を付けるので、本文は結びの一文で終える。",
    "絵文字・顔文字は使わない。誇張した表現や過剰な謝罪は避ける。",
    termsBlock(),
    settings.memo ? "追加の指示: " + settings.memo : ""
  ].filter(Boolean).join("\n");
}

function parseJson(raw){
  const t = String(raw).replace(/```json|```/g, "").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if(a === -1 || b === -1) throw new Error("AI の返答を読み取れませんでした: " + t.slice(0,150));
  return JSON.parse(t.slice(a, b + 1));
}

// AI の指示だけでは揺れるので、表示する直前にコード側で必ず整える。
function polish(body, counterpart){
  let b = String(body || "").replace(/\r/g, "");

  const lines = b.split("\n");
  while(lines.length){
    const t = lines[lines.length - 1].trim();
    if(t === "" || /^[-–—―‐_=＝ー]{3,}$/.test(t) ||
       t.indexOf("アップフロントワークス") !== -1 || t.indexOf("UP-FRONT") !== -1 ||
       t.indexOf("Jo Takasaki") !== -1 || t.indexOf("j-takasaki@") !== -1 ||
       /^高崎/.test(t) || /^(携帯|Email|E-mail|TEL|Tel|電話)\s*[:：]/.test(t)) lines.pop();
    else break;
  }
  while(lines.length && lines[0].trim() === "") lines.shift();
  b = lines.join("\n");

  // 名乗りは署名に任せる
  b = b.replace(/(株式会社)?アップフロントワークスの高崎(晟)?で(す|ございます)[。、]?/g, "")
       .replace(/高崎(晟)?で(す|ございます)[。、]?/g, "");

  // 挨拶を相手のドメインで固定
  if(counterpart){
    const want = /@[^@]*ufg/i.test(counterpart) ? "お疲れ様です。" : "お世話になっております。";
    b = b.replace(/平素より大変お世話になっております[。、]?/g, want)
         .replace(/いつも大変お世話になっております[。、]?/g, want)
         .replace(/いつもお世話になっております[。、]?/g, want)
         .replace(/お世話になっております[。、]?/g, want)
         .replace(/お疲れさまです[。、]?/g, want)
         .replace(/お疲れ様です[。、]?/g, want);
  }

  // 敬称。ビジネスだけ「様」、それ以外はすべて「さま」。
  const K1 = "\u0001", K2 = "\u0002";
  b = b.replace(/お疲れ様です/g, K1).replace(/たくさん/g, K2);
  if(settings.level === "strong"){
    b = b.replace(/さま/g, "様").replace(/さん/g, "様");
  } else {
    b = b.replace(/さん/g, "さま");
    const ln = b.split("\n");
    for(let i = 0; i < ln.length; i++){
      if(ln[i].trim() === "") continue;
      ln[i] = ln[i].replace(/様(\s*)$/, "さま$1");
      break;
    }
    b = ln.join("\n");
  }
  b = b.split(K1).join("お疲れ様です").split(K2).join("たくさん");

  return b.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").replace(/\s+$/, "");
}

/* ---------- 保存 ---------- */
const KEY = "mailai.v1", SCHEMA = 15;
const store = (() => {
  let ok = false;
  try { localStorage.setItem("_t","1"); localStorage.removeItem("_t"); ok = true; } catch(e){}
  const mem = {};
  return { persistent: ok,
    get(k){ try { if(ok) return localStorage.getItem(k); return (k in mem) ? mem[k] : null; } catch(e){ return (k in mem) ? mem[k] : null; } },
    set(k,v){ try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ mem[k]=v; } } };
})();

const DEFAULT_TERMS = [
  { from:"お茶の間", to:"OCHA NORMA" },
  { from:"ロージー", to:"ロージークロニクル" }
];

const DEFAULT_INTENTS = [
  { id:"ok",       label:"了解する",   hint:"内容を受けて承諾する" },
  { id:"schedule", label:"日程を返す", hint:"こちらの都合を示して日程を決めにいく" },
  { id:"decline",  label:"やんわり断る", hint:"角を立てずに辞退し、可能なら代案を添える" },
  { id:"ask",      label:"確認する",   hint:"不明点を箇条書きで質問する" },
  { id:"thanks",   label:"お礼",       hint:"短くお礼を述べて締める" }
];

function migrate(raw){
  if(!raw) return null;
  let d; try { d = JSON.parse(raw); } catch(e){ return null; }
  if(!d || typeof d !== "object") return null;
  const v = d.schema || 1;
  if(v < 2){
    d.level = d.level || "mid";
    if(d.tone && !d.memo) d.memo = d.tone;
    delete d.tone; delete d.signature;
  }
  if(v < 3){ d.endpoint = d.endpoint || ""; d.token = d.token || ""; }
  if(v < 4){ if(!Array.isArray(d.terms)) d.terms = DEFAULT_TERMS.slice(); }
  if(v < 5){ d.fast = !!d.fast; }
  if(v < 6){ d.apiKey = d.apiKey || ""; }
  if(v < 7){ if(!d.done || typeof d.done !== "object") d.done = {}; }
  if(v < 8){ if(!Array.isArray(d.todo)) d.todo = []; }
  if(v < 9){
    if(!d.samples || typeof d.samples !== "object") d.samples = {};
    if(!Array.isArray(d.edits)) d.edits = [];
  }
  if(v < 10){ d.rev = d.rev || 0; }
  if(v < 11){ if(!d.draft || typeof d.draft !== "object") d.draft = null; }
  if(v < 12){
    if(!d.tone || typeof d.tone !== "object") d.tone = {};
    if(!d.triage || typeof d.triage !== "object") d.triage = {};
    if(typeof d.aiTriage !== "boolean") d.aiTriage = false;
    if(typeof d.preflight !== "boolean") d.preflight = true;
  }
  if(v < 13){ if(!d.waitDone || typeof d.waitDone !== "object") d.waitDone = {}; }
  if(v < 14){ if(!d.scan || typeof d.scan !== "object") d.scan = {}; }
  if(v < 15){ if(typeof d.fs !== "number") d.fs = 1; }
  d.schema = SCHEMA;
  if(!Array.isArray(d.intents) || !d.intents.length) d.intents = DEFAULT_INTENTS.slice();
  if(!LEVELS[d.level]) d.level = "mid";
  return d;
}

const MODEL = "claude-sonnet-5";
const MODEL_FAST = "claude-haiku-4-5-20251001";

// キーが入っていれば Claude を直接呼ぶ。往復が1回減り、書きながら流せる。
// 入っていなければ従来どおり Apps Script 経由。
async function aiText(system, user, onDelta, maxTokens){
  if(!settings.apiKey){
    const r = await api("ai", { system, user, maxTokens });
    return r.text || "";
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": settings.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: settings.fast ? MODEL_FAST : MODEL,
      max_tokens: maxTokens || 1600,
      thinking: { type: "disabled" },
      stream: true,
      system, messages: [{ role: "user", content: user }]
    })
  });
  if(!res.ok){
    let why = "";
    try { why = (await res.json()).error.message; } catch(e){}
    throw new Error("AI が応答しませんでした（" + res.status + "）" + why);
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "";
  for(;;){
    const { done, value } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream:true });
    let i;
    while((i = buf.indexOf("\n\n")) !== -1){
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      for(const line of chunk.split("\n")){
        if(!line.startsWith("data:")) continue;
        const d = line.slice(5).trim();
        if(!d || d === "[DONE]") continue;
        let ev; try { ev = JSON.parse(d); } catch(e){ continue; }
        if(ev.type === "error") throw new Error((ev.error && ev.error.message) || "AI エラー");
        if(ev.type === "content_block_delta" && ev.delta && ev.delta.text){
          text += ev.delta.text;
          if(onDelta) onDelta(text);
        }
      }
    }
  }
  if(!text) throw new Error("AI の返答が空でした");
  return text;
}

function parseDrafts(text){
  return String(text || "").split(/\n?%%%\n?/).map(b => {
    const lines = b.replace(/^\s+/, "").split("\n");
    let tag = "";
    if(/^TAG\s*[:：]/i.test(lines[0] || "")) tag = lines.shift().replace(/^TAG\s*[:：]\s*/i, "").trim();
    return { tag, text: lines.join("\n").trim() };
  }).filter(d => d.text);
}

function mergeTodo(fetched){
  const keep = {};
  (settings.todo || []).forEach(t => keep[t.id] = t);
  // 今回取得できたものは状態が確定する。返信済み・対象外になったものは落とす。
  fetched.forEach(t => {
    if(needsReply(t)){ keep[t.id] = slimThread(t); return; }
    // 消すのは「自分が返した」「片付けた」ときだけ。判定が揺れても消さない。
    if(t.replied || MINE.test(t.addr || "") || settings.done[doneKey(t)]) delete keep[t.id];
  });
  const seen = {}, out = [];
  fetched.forEach(t => { if(keep[t.id] && !seen[t.id]){ out.push(keep[t.id]); seen[t.id] = 1; } });
  (settings.todo || []).forEach(t => { if(keep[t.id] && !seen[t.id]){ out.push(keep[t.id]); seen[t.id] = 1; } });
  settings.todo = out.slice(0, 200);
  flush();
  pushState();
}

async function pullState(){
  if(!connected()) return;
  try{
    const r = await api("stateGet", {});
    if(!r.state) return;
    const rs = JSON.parse(r.state);
    if(!rs || typeof rs !== "object") return;
    if((rs.rev || 0) <= (settings.rev || 0)) return;   // こちらの方が新しければ触らない
    settings.done = Object.assign({}, rs.done || {}, settings.done || {});
    settings.waitDone = Object.assign({}, rs.waitDone || {}, settings.waitDone || {});
    settings.todo = (rs.todo || []).filter(t => !settings.done[doneKey(t)]);
    if(Array.isArray(rs.edits) && rs.edits.length) settings.edits = rs.edits;
    settings.rev = rs.rev || 0;
    flush();
    renderFilters();
    if(currentBox === "TODO"){ threads = (settings.todo || []).slice(); renderList(); }
  }catch(e){}

  if(currentBox === "WAIT"){ settings.waitDone = settings.waitDone || {}; settings.waitDone[id] = 1; }
  else settings.done[doneKey(t)] = 1;
  dropTodo(id);
}, "片付け");

      renderList(); renderFilters(); return;

    if(currentBox === "DRAFTS2"){

      if(box === "TODO") mergeTodo([t]);
      putBack(t, box === "WAIT" ? "SENT" : "INBOX");
    });
  });

async function open(id){
  const row = threads.find(t => t.id === id);
  if(!row) return;
  currentId = id;
  row.unread = false;
  currentDrafts = null; draftsBusy = false; draftsError = "";
  openMsgs = {};
  dockForceNew = false;
  const tone = toneFor(row.addr);           // その相手に前回使った文体へ
  if(tone && tone !== settings.level){ settings.level = tone; flush(); refreshSegs(); }
  document.body.classList.add("reading");
  // 一覧が持っている分でまず表示する。全文は裏で取りに行く。
  current = { id: id, subject: row.subject, messages: [{ id: row.msgId || id, from: row.from,
    addr: row.addr, to: row.to, date: row.date, subject: row.subject, body: row.body || "" }] };
  // 前に開いたことがあれば、その中身をすぐ出す。裏で最新に差し替える。
  const cached = store.get("th." + id);
  let hadCache = false;
  if(cached){
    try{
      const c = JSON.parse(cached);
      if(c && c.messages && c.messages.length){ current = c; hadCache = true; }
    }catch(e){}
  }
  if(!hadCache) rdBusy(true);
  markReadLocal(id);
  renderSidebar(); renderList(); renderReader();
  try{
    const full = await api("thread", { id });   // 裏側が Gmail 側も既読にする
    if(currentId === id){ current = full; renderReader(); }
    cacheThread(full);
    markReadLocal(id);
    rdBusy(false);
  }catch(e){
    // 全文が取れなくても既読だけは付けにいく
    api("read", { id }).catch(() => {});
    rdBusy(false);
    if(currentId === id) banner("全文を取得できませんでした。" + e.message);
  }
}

// 一覧を出したあと、上のほうのスレッドを裏で先に取っておく。
// 開いた瞬間に出したいので、順番に、間を空けて取る。
let prefetching = false;
async function prefetchTop(list){
  if(prefetching || !connected()) return;
  prefetching = true;
  try{
    for(const t of (list || []).slice(0, 4)){
      if(store.get("th." + t.id)) continue;      // すでに持っていれば飛ばす
      try{
        const full = await api("thread", { id: t.id, markRead: false });
        cacheThread(full);
      }catch(e){ break; }
      await new Promise(r => setTimeout(r, 400));
    }
  } finally { prefetching = false; }
}

// 開いたスレッドを端末に置いておく。全部は重いので、直近の数通だけ。
function cacheThread(full){
  try{
    const slim = {
      id: full.id, subject: full.subject, total: full.total,
      messages: (full.messages || []).slice(-6).map(m => ({
        id:m.id, from:m.from, addr:m.addr, to:m.to, cc:m.cc, date:m.date,
        subject:m.subject, body:String(m.body||"").slice(0,4000), files:m.files || []
      }))
    };
    saveList("th." + full.id, slim);
    // 増えすぎないよう、覚えるスレッドは30件まで
    const keys = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf("th.") === 0) keys.push(k);
    }
    if(keys.length > 150) keys.slice(0, keys.length - 150).forEach(k => localStorage.removeItem(k));
  }catch(e){}
}

// 既読を、画面・保存してある一覧・キャッシュのすべてに反映する。
// どれかが取り残されると、戻ったときに未読へ巻き戻って見える。
function rdBusy(on){
  const h = $("rdBusy");
  if(h) h.hidden = !on;
}

function markReadLocal(id){
  const t = threads.find(x => x.id === id);
  if(t) t.unread = false;
  const a = (inboxAll || []).find(x => x.id === id);
  if(a) a.unread = false;
  const w = (settings.todo || []).find(x => x.id === id);
  if(w){ w.unread = false; flush(); }
  for(const box of ["INBOX","SENT","ARCHIVE","TRASH"]){
    const raw = store.get("cache." + box);
    if(!raw) continue;
    try{
      const list = JSON.parse(raw) || [];
      let hit = false;
      list.forEach(x => { if(x.id === id && x.unread){ x.unread = false; hit = true; } });
      if(hit) store.set("cache." + box, JSON.stringify(list));
    }catch(e){}
  }
}

function lastMsg(){ const m = current && current.messages; return m ? m[m.length-1] : null; }

// 返信の相手。自分が最後に送っていたら、その前の受信メールを対象にする。
function replyTarget(){
  const m = current && current.messages;
  if(!m || !m.length) return null;
  for(let i = m.length - 1; i >= 0; i--){
    if(!MINE.test(m[i].addr || "")) return m[i];
  }
  return null;   // 全部自分の送信なら返信案は出さない
}

// 引用部分を本文から切り離す。普通のメーラーと同じく畳んで隠す。
const QUOTE_START = /^\s*(>|＞)|^\s*[-_]{2,}\s*(Original Message|元のメッセージ|転送されたメッセージ)|^\s*(From|差出人|Sent|送信日時|To|宛先|Cc|Subject|件名)\s*[:：]|wrote:\s*$|^\s*\d{4}年\d{1,2}月\d{1,2}日.*[:：]\s*$/;
function splitQuote(body){
  const lines = String(body || "").split("\n");
  for(let i = 0; i < lines.length; i++){
    if(QUOTE_START.test(lines[i])){
      let j = i;
      while(j > 0 && lines[j-1].trim() === "") j--;   // 直前の空行も引用側へ
      const main = lines.slice(0, j).join("\n").replace(/\s+$/, "");
      if(!main.trim()) break;            // 全部が引用なら畳まない
      return { main, quote: lines.slice(j).join("\n").replace(/\s+$/, "") };
    }
  }
  return { main: String(body || "").replace(/\s+$/, ""), quote: "" };
}

// 宛先の要約表示
function recipientSummary(m){
  const all = addrList(m.to).concat(addrList(m.cc));
  if(!all.length) return m.to || "";
  const head = all[0].name || all[0].addr;
  return all.length > 1 ? head + " 他" + (all.length - 1) + "人" : head;
}

// "名前 <a@b.c>, x@y.z" を分解する
function addrList(raw){
  return String(raw || "").split(",").map(one => {
    const t = one.trim();
    if(!t) return null;
    const m2 = t.match(/^\s*"?([^"<]*)"?\s*<([^>]+)>\s*$/);
    if(m2) return { name: m2[1].trim(), addr: m2[2].trim() };
    return { name: "", addr: t };
  }).filter(Boolean);
}

// 全員に返信のCc。自分のアドレスと差出人は外す。
const MINE = /j-takasaki@(ufg\.co\.jp|bu\.k-cloud90\.biz)/i;
function replyAllCc(m){
  const seen = {}, out = [];
  [m.to, m.cc].forEach(f => String(f||"").split(",").forEach(one => {
    const hit = one.match(/[\w.+-]+@[\w.-]+\.\w+/);
    if(!hit) return;
    const a = hit[0], k = a.toLowerCase();
    if(MINE.test(a)) return;
    if(m.addr && k === String(m.addr).toLowerCase()) return;
    if(seen[k]) return;
    seen[k] = 1; out.push(a);
  }));
  return out.join(", ");
}

  box.innerHTML = currentDrafts.map((d,i) => `

  const openDraft = (idx, all) => {
    const m = replyTarget() || lastMsg(), d = currentDrafts[idx];
    if(!m || !d) return;
    const mine = MINE.test(m.addr || "");
    openCompose({
      quote: m,
      to: mine ? (m.to || "") : (m.addr || ""), cc: all && !mine ? replyAllCc(m) : "",
      subject:/^Re:/i.test(m.subject||"")?m.subject:"Re: "+(m.subject||""),
      body:d.text, title: all ? "全員に返信" : "返信",
      threadId: current && current.id, all,
      source:{ kind:"reply", intent:lastIntent && lastIntent.id, hint:lastIntent && lastIntent.hint, msg:m }
    });
  };
  box.querySelectorAll("[data-i]").forEach(b => b.onclick = () => openDraft(+b.dataset.i, false));
  box.querySelectorAll("[data-all]").forEach(b => b.onclick = () => openDraft(+b.dataset.all, true));
}

async function generate(intent){
  const m = replyTarget();
  if(!m || !intent) return;
  lastIntent = intent;
  draftsBusy = true; draftsError = ""; currentDrafts = null; streamText = "";
  renderDrafts();
  try{
    const sys = baseSystem(m.addr) + "\n" + [
      "",
      "これから渡すのは、受け取ったメールの本文である。内容を読み解いた上で返信を書く。",
      "相手が尋ねている点・依頼している点をすべて拾い、どれにも触れずに終わらせない。",
      "相手の名前は差出人欄から取り、文体に合った敬称を付ける（親しみ・丁寧は「◯◯さま」、ビジネスは「◯◯様」）。",
      "返信の方針: " + (intent.hint || "内容に沿って返す"),
      "",
      "出力は次の形式だけ。前置き・説明・コードブロックは付けない。",
      "TAG: 案の性格を4字以内",
      "本文",
      "",
      "案は1つだけ。方針に沿った最も素直な返しを書く。",
      "署名を除いて8行以内に収める。冗長にしない。"
    ].join("\n");
    const usr = [
      "差出人: " + (m.from || ""),
      "件名: " + (m.subject || ""),
      "本文:",
      String(m.body || "").slice(0, 3000)
    ].join("\n");
    const sysWithStyle = sys + styleBlock(await samplesFor(m.addr));
    let last = 0;
    const raw = await aiText(sysWithStyle, usr, t => {
      streamText = t;
      const now = Date.now();
      if(now - last > 90){ last = now; renderDrafts(); }
    });
    streamText = "";
    currentDrafts = parseDrafts(raw).slice(0,1).map((d,i) =>
      ({ tag: d.tag || ("案" + (i+1)), text: ensureSig(polish(d.text, m.addr)) }));
    draftsBusy = false; renderDrafts();
    const sc = $("rdScroll");
    if(sc) sc.scrollTo({ top: 0, behavior: "smooth" });
  }catch(e){
    draftsBusy = false; streamText = "";
    draftsError = "返信案を作れませんでした。" + e.message;
    banner(draftsError);
    renderDrafts();
  }
}

/* ---------- 読み込み ---------- */
async function load(opts){
  const force = !!(opts && opts.force);
  const key = "cache." + (currentBox === "WAIT" ? "SENT" : currentBox);

  // 1. まず手元にあるものを出す。切り替えのたびに空にしない。
  threads = boxView(readCache(key));
  loading = !threads.length;
  renderSidebar(); renderList(); renderFilters();

  // 2. 取ったばかりなら取りに行かない。切り替えただけで待たされないようにする。
  const age = Date.now() - Number(store.get(key + ".at") || 0);
  if(!force && !query && threads.length && age < 600000){
    loading = false;
    renderList();
    if(currentBox === "INBOX") setTimeout(() => prefetchTop(threads), 1500);
    return;
  }

  if(!threads.length){ $("pullHint").hidden = false; $("pullHint").textContent = "更新中"; }
  try{
    let raw;
    if(currentBox === "DRAFTS2"){
      const dr = await api("drafts", {});
      raw = (dr.drafts || []).map(d => ({
        id: d.draftId, draftId: d.draftId, from: d.to || "(宛先なし)", addr: d.to || "",
        to: d.to, cc: d.cc, subject: d.subject, date: d.date, body: d.body, unread: false
      }));
    } else {
      const box = currentBox === "TODO" ? "INBOX" : (currentBox === "WAIT" ? "SENT" : currentBox);
      const r = await api("threads", { box, query, all: !!query,
        full: currentBox === "WAIT",   // 相手の返信も含めた最後の1通が要る
        limit: currentBox === "TODO" ? 20 : 15 });
      raw = r.threads || [];
      if(box === "INBOX" && !query){
        inboxAll = raw;
        mergeTodo(raw);
        // 判定と先読みは、一覧が出そろってから順に流す。同時に走らせると取得が遅くなる。
        setTimeout(() => {
          aiTriage(raw).then(() => {
            mergeTodo(raw); renderFilters();
            if(currentBox === "TODO"){ threads = boxView([]); renderList(); }
          }).then(() => prefetchTop(raw));
        }, 1200);
      }
    }
    if(!query) writeCache(key, raw);
    threads = boxView(raw);
    renderFilters();
    banner(connected() ? "" : "ウェブアプリが未接続です。設定からURLと合言葉を入れてください。（いまは見本を表示しています）");
  }catch(e){
    // 失敗しても手元のものは消さない。理由だけ出す。
    banner("受信できませんでした。" + e.message);
  }finally{
    loading = false;
    $("pullHint").hidden = true; $("pullHint").textContent = "引いて更新";
    renderSidebar(); renderList();
    if(!currentId) renderReader();
  }
}

// 片付けたものは、保存してある一覧からも消す。次に切り替えたとき戻ってこないように。
function dropFromCaches(id){
  ["INBOX","SENT","WAIT","DRAFTS2","ARCHIVE","TRASH"].forEach(box => {
    const k = "cache." + box;
    const raw = store.get(k);
    if(!raw) return;
    try{
      const list = JSON.parse(raw) || [];
      const left = list.filter(x => x.id !== id);
      if(left.length !== list.length) store.set(k, JSON.stringify(left));
    }catch(e){}
  });
}

// 過去へさかのぼる。要返信と返事待ちは、判定し直したぶんだけ増える。
async function loadMore(){
  const b = $("btnMore");
  const scanning = (currentBox === "TODO" || currentBox === "WAIT");
  const box = currentBox === "TODO" ? "INBOX" : (currentBox === "WAIT" ? "SENT" : currentBox);
  const before = threads.length;
  if(b){ b.textContent = "調べています…"; b.disabled = true; }
  try{
    settings.scan = settings.scan || {};
    const start = scanning ? (settings.scan[box] || 15) : threads.length;
    const r = await api("threads", { box, query, all: !!query,
      full: currentBox === "WAIT", limit: 25, start });
    const raw = r.threads || [];
    if(!raw.length){
      banner("これ以上ありません。");
      if(b){ b.textContent = scanning ? "過去をさかのぼって調べる" : "さらに読み込む"; b.disabled = false; }
      return;
    }
    if(scanning){
      settings.scan[box] = start + raw.length;
      flush();
    }
    if(!query) writeCache("cache." + box, readCache("cache." + box).concat(raw));
    if(box === "INBOX" && !query) mergeTodo(raw);
    threads = boxView(readCache("cache." + currentBox));
    renderList(); renderFilters();
    const got = threads.length - before;
    banner(scanning
      ? (start + "件目から" + raw.length + "件を調べ、" + (got > 0 ? got + "件が該当しました。" : "該当はありませんでした。"))
      : "");
    setTimeout(() => banner(""), 4000);
  }catch(e){
    banner("読み込めませんでした。" + e.message);
    if(b){ b.textContent = scanning ? "過去をさかのぼって調べる" : "さらに読み込む"; b.disabled = false; }
  }
}

// 箱ごとの保存。要返信だけは設定側に持っているのでそちらを使う。
function readCache(key){
  if(key === "cache.TODO") return (settings.todo || []).slice();
  if(query) return [];
  const raw = store.get(key);
  if(!raw) return [];
  try { return JSON.parse(raw) || []; } catch(e){ return []; }
}
// 取ったものを積み上げる。普通のメーラーと同じで、一度見たものは消えない。
function writeCache(key, fresh){
  if(key === "cache.TODO") return;          // 要返信は mergeTodo が持つ
  try{
    const old = readCache(key);
    const seen = {}, out = [];
    (fresh || []).forEach(t => { if(!seen[t.id]){ seen[t.id] = 1; out.push(t); } });
    old.forEach(t => { if(!seen[t.id]){ seen[t.id] = 1; out.push(t); } });
    saveList(key, out.slice(0, 400));
    store.set(key + ".at", String(Date.now()));
  }catch(e){}
}

// 保存しきれないときは、古いスレッドの本文から順に捨てて場所を空ける
function saveList(key, list){
  for(let attempt = 0; attempt < 4; attempt++){
    try{ store.set(key, JSON.stringify(list)); return; }
    catch(e){
      const keys = [];
      for(let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.indexOf("th.") === 0) keys.push(k);
      }
      if(!keys.length){ list = list.slice(0, Math.max(30, Math.floor(list.length / 2))); continue; }
      keys.slice(0, Math.ceil(keys.length / 3)).forEach(k => localStorage.removeItem(k));
    }
  }
}
// 保存してあるものから、いまの箱で見せるぶんだけを取り出す
function boxView(list){
  if(currentBox === "TODO") return (settings.todo || []).slice();
  if(currentBox === "WAIT" && !list.length) list = readCache("cache.SENT");
  if(currentBox === "WAIT"){
    // 送信済みのうち、最後の1通が自分のもの＝相手からまだ返ってきていない
    return (list || []).filter(t => !MINE.test(t.toAll || t.to || "") && !(settings.waitDone || {})[t.id]);
  }
  return (list || []).slice();
}

// 走り書き → 新規メール
async function composeFromBrief(brief){
  const list = (await contacts()).slice(0, 200)
    .map(c => (c.name ? c.name + " " : "") + "<" + c.addr + ">").join("\n");
  const sys = baseSystem("") + "\n" + [
    "",
    "これから渡すのは、高崎本人が書いた走り書きのメモである。まず内容を読み解いてから、メールに書き直す。",
    "手順:",
    "1. 誰に宛てたものかを特定する。連絡先一覧に該当する人がいれば、そのメールアドレスを to に入れる。",
    "   苗字だけ・呼び名だけでも一覧と照合する。確信が持てなければ to は空にする。推測でアドレスを作らない。",
    "2. 「CCで◯◯」「◯◯にも共有」「◯◯も入れて」のような書き方があれば、その人は cc に入れる。",
    "   to と cc を取り違えない。cc の人は本文の宛名には書かない。cc が無ければ空文字にする。",
    "3. 本文は必ず宛名の行から始める。氏名が分かれば文体に合った敬称を付ける（親しみ・丁寧は「◯◯さま」、ビジネスは「◯◯様」）。",
    "   氏名が分からなければ会社名や部署名、それも分からなければ「ご担当者さま」（ビジネスのみ「ご担当者様」）とする。",
    "4. 走り書きの中の事実（日時・場所・人数・期限・条件・代替案）をすべて拾い、ひとつも落とさない。",
    "5. 用件が一目で分かる件名を20字前後で付ける。",
    "6. 走り書きの語順や口調は捨て、指定の文体で整った本文に書き直す。",
    "",
    "連絡先一覧:",
    list || "（まだありません）",
    "",
    "出力は次の JSON のみ。前置きもコードブロックも付けない。",
    '{"to":"","cc":"","subject":"","body":"","note":""}',
    "note には、走り書きから読み取れず補えなかった点があれば一言で書く。無ければ空文字。"
  ].join("\n");
  const out = await ai(sys + styleBlock(await samplesFor("")), "走り書き:\n" + brief);
  return {
    to: out.to || "", cc: out.cc || "", subject: out.subject || "", note: out.note || "",
    body: ensureSig(polish(out.body, out.to || ""))
  };
}

// 返事が来ていないときの、やわらかい催促
async function makeNudge(){
  const m = lastMsg();
  if(!m) return;
  const to = m.to || "";
  draftsBusy = true; draftsError = ""; streamText = ""; renderDrafts();
  try{
    const sys = baseSystem(to) + styleBlock(await samplesFor("")) + "\n" + [
      "",
      "以前こちらから送ったメールに、相手からまだ返事が来ていない。やわらかく催促する短い文を書く。",
      "責める調子にしない。急かす理由があるなら添え、無ければ「その後いかがでしょうか」程度に留める。",
      "同じ用件を一から説明し直さない。何の件かが分かる一言だけ触れる。",
      "出力は次の形式だけ。前置き・説明は付けない。",
      "TAG: 催促",
      "本文"
    ].join("\n");
    const usr = ["以前送った本文:", String(m.body || "").slice(0, 1200)].join("\n");
    let last = 0;
    const raw = await aiText(sys, usr, t => {
      streamText = t;
      const now = Date.now();
      if(now - last > 90){ last = now; renderDrafts(); }
    });
    streamText = "";
    const got = parseDrafts(raw)[0];
    if(got) currentDrafts = [{ tag: got.tag || "催促", text: ensureSig(polish(got.text, to)) }];
  }catch(e){
    draftsError = "催促の案を作れませんでした。" + e.message;
    banner(draftsError);
  }finally{
    draftsBusy = false; streamText = ""; renderDrafts();
  }
}

// いま出ている案に重ねて指示する
async function refine(instruction){
  const m = replyTarget();
  const d = currentDrafts && currentDrafts[0];
  if(!m || !d || !instruction) return;
  draftsBusy = true; draftsError = ""; streamText = ""; renderDrafts();
  try{
    const sys = baseSystem(m.addr) + styleBlock(await samplesFor(m.addr)) + "\n" + [
      "",
      "いま高崎に見せている返信案を、指示にしたがって直す。",
      "内容の骨子は保ち、指示された点だけを変える。",
      "出力は次の形式だけ。前置き・説明は付けない。",
      "TAG: 案の性格を4字以内",
      "本文"
    ].join("\n");
    const usr = ["いまの案:", d.text, "", "直しの指示: " + instruction].join("\n");
    let last = 0;
    const raw = await aiText(sys, usr, t => {
      streamText = t;
      const now = Date.now();
      if(now - last > 90){ last = now; renderDrafts(); }
    });
    streamText = "";
    const got = parseDrafts(raw)[0];
    if(got) currentDrafts = [{ tag: got.tag || "直し", text: ensureSig(polish(got.text, m.addr)) }];
  }catch(e){
    draftsError = "直せませんでした。" + e.message;
    banner(draftsError);
  }finally{
    draftsBusy = false; streamText = ""; renderDrafts();
  }
}

async function quick(){
  const brief = dkIn.value.trim();
  if(!brief){ dkIn.focus(); return; }
  if(dockMode() === "reply"){
    dkIn.value = ""; autogrow();
    // すでに案が出ていれば、作り直さずにその案を直す
    if(currentDrafts && currentDrafts.length) await refine(brief);
    else await generate({ id:"free", label:"指示", hint: brief });
    return;
  }
  $("dkGo").disabled = true;
  $("dkHint").textContent = "「" + L().name + "」で組み立てています…";
  try{
    const r = await composeFromBrief(brief);
    openCompose({ to:r.to||"", cc:r.cc||"", subject:r.subject||"",
      body:r.body||"", title:"新規メッセージ", source:{ kind:"quick", brief } });
    dkIn.value = ""; autogrow();
    $("dkHint").textContent = r.note ? r.note : (r.to ? "" : "宛先が特定できませんでした。作成画面で入れてください。");
  }catch(e){
    $("dkHint").textContent = "作成できませんでした";
    banner("作成できませんでした。" + e.message);   // 細い行だと読めないので帯にも出す
  }finally{ $("dkGo").disabled = false; }
}

let composeSource = null, composeThread = null, composeAll = false;
let composeFiles = [], composeDraftId = "", draftTimer = null, composeQuote = "";

// Gmail と同じように、本文の下に元のやり取りを引用として置く
function quoteBlock(m){
  if(!m || !(m.body || m.from)) return "";
  const head = (m.date || "") + " " + (m.from || "") + " <" + (m.addr || "") + ">:";
  const body = String(m.body || "").replace(/\r/g, "").split("\n").map(l => "> " + l).join("\n");
  return "\n\n" + head + "\n" + body;
}

function renderFiles(){
  const box = $("cpFiles");
  box.hidden = !composeFiles.length;
  box.innerHTML = composeFiles.map((f,i) =>
    `<span class="file">${esc(f.name)}（${fileSize(f.size)}）<button class="x" data-rm="${i}">×</button></span>`).join("");
  box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    composeFiles.splice(+b.dataset.rm, 1); renderFiles(); saveDraft();
  });
}
["cpTo","cpCc","cpSubj","cpBody"].forEach(id => $(id).addEventListener("input", saveDraft));
$("cpDrop").onclick = () => {
  clearTimeout(draftTimer);
  const id = composeDraftId;
  settings.draft = null; flush();
  if(id) api("draftDrop", { draftId: id }).catch(() => {});
  composeFiles = []; composeDraftId = "";
  $("cpTo").value = ""; $("cpCc").value = ""; $("cpSubj").value = ""; $("cpBody").value = "";
  $("compose").classList.remove("on"); $("scrim").classList.remove("on");
  banner("書きかけを捨てました");

};
$("cpAttach").onclick = () => $("cpFileInput").click();
$("cpFileInput").onchange = async () => {
  const list = [...($("cpFileInput").files || [])];
  $("cpFileInput").value = "";
  for(const f of list){
    if(f.size > 8 * 1024 * 1024){ banner(f.name + " は8MBを超えるため添付できません。"); continue; }
    const b64 = await new Promise(res => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(",")[1] || "");
      r.readAsDataURL(f);
    });
    composeFiles.push({ name: f.name, type: f.type || "application/octet-stream", size: f.size, data: b64 });
  }
  renderFiles();
};

// 書きかけを端末に保存し、宛先が入っていれば Gmail の下書きにも残す
function saveDraft(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(async () => {
    if(!$("compose").classList.contains("on")) return;
    const d = {
      to: $("cpTo").value, cc: $("cpCc").value, subject: $("cpSubj").value,
      body: $("cpBody").value, noQuote: true, threadId: composeThread, all: composeAll,
      title: $("cpTitle").textContent, draftId: composeDraftId,
      files: composeFiles.map(f => ({ name:f.name, type:f.type, size:f.size, data:f.data })),
      at: Date.now()
    };
    if(!d.to && !d.subject && !d.body.trim()){ settings.draft = null; flush(); return; }
    settings.draft = d; flush();
    try{
      const r = await api("draftSave", { draftId: composeDraftId, to: d.to, cc: d.cc,
        subject: d.subject, body: d.body });
      if(r.draftId){ composeDraftId = r.draftId; settings.draft.draftId = r.draftId; flush(); }
    }catch(e){}
  }, 1200);
}

// 署名が無い本文には必ず付ける。
function ensureSig(body){
  const b = String(body || "").replace(/\s+$/, "");
  if(b.indexOf("j-takasaki@ufg.co.jp") !== -1 && b.indexOf("UP-FRONT WORKS") !== -1) return b;
  return b + "\n\n" + SIGNATURE;
}
function openCompose(o = {}){
  composeSource = o.source || null; composeThread = o.threadId || null; composeAll = !!o.all;
  composeFiles = o.files || []; composeDraftId = o.draftId || "";
  if(o.title !== "転送") composeMode = "mail";
  // 本文の下に、これまでのやり取りを引用として置く
  const q = o.quote || (composeSource && composeSource.msg) || (o.threadId ? replyTarget() : null);
  composeQuote = o.noQuote ? "" : quoteBlock(q);
  renderFiles();
  $("cpTitle").textContent = o.title || "新規メッセージ";
  $("cpTo").value = o.to || ""; $("cpCc").value = o.cc || "";
  $("cpSubj").value = o.subject || "";
  const withSig = ensureSig(o.body || "");
  $("cpBody").value = withSig + composeQuote;
  lastGenerated = withSig;
  $("cpHint").textContent = ""; renderSeg($("cpSeg"));
  $("compose").classList.add("on"); $("scrim").classList.add("on");
  ($(o.body ? "cpBody" : "cpTo")).focus();
}
const closeCompose = () => {
  saveDraft();
  $("compose").classList.remove("on"); $("scrim").classList.remove("on");
};

  renderList(); renderFilters();
}

// 予約送信。指定した時刻に裏側が送る。
function nextTime(hhmm, addDays){
  const [h, mi] = hhmm.split(":").map(Number);
  const d = new Date();
  d.setSeconds(0, 0);
  d.setHours(h, mi);
  if(addDays) d.setDate(d.getDate() + addDays);
  else if(d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
  return d;
}
function fmtWhen(ms){
  const d = new Date(ms), n = new Date();
  const same = d.toDateString() === n.toDateString();
  const t = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  return same ? "今日 " + t : (d.getMonth()+1) + "/" + d.getDate() + " " + t;
}
$("cpLater").onclick = () => {
  if(!$("cpTo").value.trim()){ $("cpHint").textContent = "宛先が空です"; return; }
  const opts = [
    ["明日の朝 8:00", nextTime("08:00", null)],
    ["今日の 18:00", nextTime("18:00", null)],
    ["明日の 10:00", nextTime("10:00", 1)],
    ["1時間後", new Date(Date.now() + 3600000)]
  ];
  const pick = prompt("いつ送りますか。番号か、日時を直接入れてください（例 8/27 09:30）。\n" +
    opts.map((o,i) => (i+1) + ". " + o[0] + "（" + fmtWhen(o[1].getTime()) + "）").join("\n"));
  if(!pick) return;
  let at = null;
  const n = Number(pick.trim());
  if(n >= 1 && n <= opts.length) at = opts[n-1][1];
  else {
    const m2 = pick.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})\D+(\d{1,2}):(\d{2})/);
    if(m2){
      const d = new Date();
      d.setMonth(+m2[1]-1, +m2[2]); d.setHours(+m2[3], +m2[4], 0, 0);
      if(d.getTime() < Date.now()) d.setFullYear(d.getFullYear() + 1);
      at = d;
    }
  }
  if(!at){ $("cpHint").textContent = "日時を読み取れませんでした"; return; }
  scheduleSend(at.getTime());
};

// 送る前の点検。答え漏れ・日付の矛盾・添付の言い忘れ・表記ゆれを見る。
let skipCheckUntil = 0;
async function preflight(body, to){
  if(!settings.preflight || !settings.apiKey) return [];
  const src = composeSource && composeSource.msg;
  const terms = (settings.terms || []).map(x => "・" + x.from + " → " + x.to).join("\n");
  const sys = [
    "これから送るメールを送信前に点検する。指摘は事実に基づくものだけ。推測で書かない。",
    "見る点:",
    "1. 相手が尋ねた点・依頼した点に答え漏れがないか（元のメールが渡されている場合のみ）",
    "2. 日付・曜日・時刻・人数が、元のメールの内容と食い違っていないか",
    "3. 本文で添付やファイルに触れているのに、実際には添付がない",
    "4. 社内の略称や通称が、正式名称に直っていない",
    "5. 人名・曲名・社名の表記が、元のメールでの書き方と食い違っている",
    terms ? "正式名称の対応:\n" + terms : "",
    "",
    "添付の有無: " + (composeFiles.length ? composeFiles.map(f => f.name).join(", ") : "なし"),
    "",
    "出力は問題点だけを1行ずつ、最大3件。各行30字以内。",
    "問題がなければ ok とだけ書く。前置きや説明は書かない。"
  ].filter(Boolean).join("\n");
  const usr = [
    src ? "元のメール:\n" + String(src.body || "").slice(0, 1500) : "（新規メール）",
    "", "送ろうとしている本文:", body
  ].join("\n");
  try{
    const raw = await aiText(sys, usr, null, 300);
    const lines = String(raw).split("\n").map(x => x.replace(/^[-・\d.\s]+/, "").trim())
      .filter(x => x && !/^ok$/i.test(x));
    return lines.slice(0, 3);
  }catch(e){ return []; }
}

// 送信は5秒待ってから実際に飛ばす。その間は取り消せる。
let pendingSend = null;
function cancelSend(){
  if(!pendingSend) return;
  clearInterval(pendingSend.tick);
  clearTimeout(pendingSend.timer);
  const d = pendingSend.draft;
  pendingSend = null;
  banner("");
  openCompose(d);
}
$("cpSend").onclick = async () => {
  if(!$("cpTo").value.trim()){ $("cpHint").textContent = "宛先が空です"; return; }

  // 直前に点検で止めた場合は、次の押下では素通しする
  if(Date.now() > skipCheckUntil && settings.preflight && settings.apiKey){
    $("cpHint").textContent = "点検しています…";
    const bodyOnly = composeQuote ? $("cpBody").value.split(composeQuote)[0] : $("cpBody").value;
    const issues = await preflight(bodyOnly, $("cpTo").value);
    if(issues.length){
      skipCheckUntil = Date.now() + 120000;
      $("cpHint").textContent = "点検: " + issues.join(" ／ ") + "　もう一度押すとこのまま送ります";
      return;
    }
  }
  skipCheckUntil = 0;
  $("cpHint").textContent = "";
  const payload = {
    threadId: composeThread, all: composeAll, to: $("cpTo").value, cc: $("cpCc").value,
    subject: $("cpSubj").value, body: $("cpBody").value, signature: SIGNATURE,
    draftId: composeDraftId, files: composeFiles
  };
  const draft = {
    to: payload.to, cc: payload.cc, subject: payload.subject, body: payload.body,
    threadId: composeThread, all: composeAll, title: $("cpTitle").textContent,
    draftId: composeDraftId, files: composeFiles
  };
  const to = payload.to;
  const gen = lastGenerated, sent = payload.body, thread = composeThread;
  const mode = composeMode, fwdId = forwardMsgId;
  composeMode = "mail";

  clearTimeout(draftTimer);
  settings.draft = null; flush();
  $("compose").classList.remove("on"); $("scrim").classList.remove("on");

  let left = 5;
  const show = () => {
    const b = $("banner");
    b.textContent = "送信します（" + left + "秒）　タップで取り消す";
    b.className = "banner on";
    b.style.cursor = "pointer";
    b.onclick = cancelSend;
  };
  show();
  const tick = setInterval(() => { left--; if(left > 0) show(); }, 1000);
  const timer = setTimeout(async () => {
    clearInterval(tick);
    pendingSend = null;
    const b = $("banner"); b.onclick = null; b.style.cursor = "";
    banner("送信中…");
    try{
      const r = mode === "forward"
        ? await api("forward", { msgId: fwdId, to: payload.to, cc: payload.cc, note: payload.body })
        : await api("send", payload);
      rememberEdit(to, gen, composeQuote ? sent.split(composeQuote)[0] : sent);
      rememberTone(to, settings.level);
      if(thread) dropTodo(thread);
      renderFilters();
      banner("送信しました" + (r.from ? "（差出人: " + r.from + "）" : ""));
      setTimeout(() => banner(""), 4000);
    }catch(e){
      banner("送信できませんでした。" + e.message);
      settings.draft = draft; flush();
    }
  }, 5000);
  pendingSend = { timer, tick, draft };
};

function calUrl(ev){
  const pad = n => String(n).padStart(2, "0");
  const stamp = (d, t) => {
    const [Y,M,D] = d.split("-").map(Number);
    const [h,mi] = (t || "00:00").split(":").map(Number);
    // Google カレンダーは UTC で受け取るので、日本時間から9時間引く
    const dt = new Date(Date.UTC(Y, M-1, D, h - 9, mi));
    return dt.getUTCFullYear() + pad(dt.getUTCMonth()+1) + pad(dt.getUTCDate()) + "T" +
           pad(dt.getUTCHours()) + pad(dt.getUTCMinutes()) + "00Z";
  };
  const p = new URLSearchParams();
  p.set("action", "TEMPLATE");
  p.set("text", ev.title || "予定");
  if(ev.date) p.set("dates", stamp(ev.date, ev.start) + "/" + stamp(ev.end_date || ev.date, ev.end || ev.start));
  if(ev.place) p.set("location", ev.place);
  if(ev.note) p.set("details", ev.note);
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

      <div class="d">要返信と返事待ちで「片付けた」印を消します。消すと、条件に合うものがもう一度並びます。</div></div>
      <button class="sh-btn danger" id="btnUndone">消す</button></div>
    <div class="sh-row"><div class="k"><div class="n">さかのぼった位置</div>
      <div class="d">受信 ${(settings.scan||{}).INBOX || 15}件目まで ／ 送信済み ${(settings.scan||{}).SENT || 15}件目まで調べました。
先頭に戻すと、次の「さかのぼって調べる」で最初から調べ直します。</div></div>
      <button class="sh-btn" id="btnRescan">先頭に戻す</button></div>

    <div class="sh-sec">AI の働き</div>
    <div class="sh-row"><div class="k"><div class="n">${settings.aiTriage ? "要返信をAIが判定" : "要返信を規則で判定"}</div>
      <div class="d">本文を読んで「返事が要るか」を判断します。切ると、宛先と書き出しだけで判定します。</div></div>
      <button class="sh-btn" id="btnTriage">${settings.aiTriage ? "規則にする" : "AIにする"}</button></div>
    <div class="sh-row"><div class="k"><div class="n">${settings.preflight ? "送る前に点検する" : "点検しない"}</div>
      <div class="d">答え漏れ・日付の食い違い・添付の言い忘れ・表記ゆれを送信前に見ます。
指摘が出たら止まり、もう一度押すとそのまま送ります。</div></div>
      <button class="sh-btn" id="btnPre">${settings.preflight ? "やめる" : "する"}</button></div>

    <div class="sh-sec">書き方の学習</div>
    <div class="sh-row"><div class="k"><div class="n">手本 ${Object.keys(settings.samples||{}).length}件 ／ 直しの記録 ${(settings.edits||[]).length}件</div>
      <div class="d">相手ごとに過去の送信メールを手本として覚え、生成に使います。生成案を直して送ると、その差分も覚えます。
覚え違いが気になるときは消してください。次から取り直します。</div></div>
      <button class="sh-btn danger" id="btnForget">忘れる</button></div>

    <div class="sh-sec">言い換え</div>
    ${(settings.terms||[]).map((t,i) => `
      <div class="sh-row"><div class="k"><div class="n">${esc(t.from)} → ${esc(t.to)}</div></div>
      <button class="sh-btn danger ${armedTerm===i?"armed":""}" data-delterm="${i}">${armedTerm===i?"もう一度で削除":"削除"}</button></div>`).join("")}
    <div class="sh-row"><div class="k"><input class="sh-in" id="newFrom" placeholder="普段の言い方（例: お茶の間）"></div>
      <div class="k"><input class="sh-in" id="newTo" placeholder="正式名称（例: OCHA NORMA）"></div>
      <button class="sh-btn" id="addTerm">追加</button></div>

    <div class="sh-sec">返信のボタン</div>
    ${settings.intents.map(i => `
      <div class="sh-row"><div class="k"><div class="n">${esc(i.label)}</div><div class="d">${esc(i.hint)}</div></div>
      <button class="sh-btn danger ${armedDelete===i.id?"armed":""}" data-del="${esc(i.id)}">${armedDelete===i.id?"もう一度で削除":"削除"}</button></div>`).join("")}
    <div class="sh-row"><div class="k"><input class="sh-in" id="newLabel" placeholder="ボタン名（例: 見積を返す）"></div>
      <button class="sh-btn" id="addIntent">追加</button></div>
    <div class="sh-row"><div class="k"><input class="sh-in" id="newHint" placeholder="どう書いてほしいか"></div></div>

    <div class="sh-sec">データ</div>
    <div class="sh-row"><div class="k"><div class="n">書き出し・読み込み</div>
      <div class="d">${store.persistent?"この端末に保存されています。":"この画面ではブラウザ保存が使えません。閉じると設定は消えます。"}</div></div>
      <button class="sh-btn" id="btnExport">書き出す</button><button class="sh-btn" id="btnImport">読み込む</button></div>
    <div class="status" id="shStatus"></div>
    <div class="status" style="opacity:.6">ビルド ${BUILD}</div>`;

  const rerender = () => { flush(); renderSheet(); };
  $("inEp").oninput = e => { settings.endpoint = e.target.value.trim(); save(); };
  $("inTk").oninput = e => { settings.token = e.target.value.trim(); save(); };
  $("btnSch").onclick = async () => {
    $("schList").textContent = "読み込んでいます…";
    try{
      const r = await api("scheduled", {});
      const list = r.list || [];
      if(!list.length){ $("schList").textContent = "予約はありません。"; return; }
      $("schList").innerHTML = list.map(x =>
        `${esc(fmtWhen(x.at))}　${esc(x.to)}　${esc(x.subject)}　<button class="sh-btn" data-uns="${esc(x.id)}">取り消す</button>`).join("<br>");
      $("schList").querySelectorAll("[data-uns]").forEach(b => b.onclick = async () => {
        try{ await api("unschedule", { id: b.dataset.uns }); b.parentElement.querySelector("[data-uns]"); $("btnSch").click(); }
        catch(e){ $("schList").textContent = "取り消せませんでした。" + e.message; }
      });
    }catch(e){ $("schList").textContent = "読み込めませんでした。" + e.message; }
  };
  const FS = [["小",0.9],["中",1],["大",1.12],["特大",1.25]];
  $("fsSeg").innerHTML = FS.map(([n,v]) =>
    `<button data-fs="${v}" aria-pressed="${(settings.fs||1)===v}">${n}</button>`).join("");
  $("fsSeg").querySelectorAll("[data-fs]").forEach(b => b.onclick = () => {
    settings.fs = Number(b.dataset.fs); flush(); applyFs(); renderSheet();
  });
  $("btnUndone").onclick = () => {
    settings.done = {}; settings.waitDone = {}; flush(); pushState(); renderSheet();
  };
  $("btnRescan").onclick = () => { settings.scan = {}; flush(); renderSheet(); };
  $("btnTriage").onclick = () => { settings.aiTriage = !settings.aiTriage; flush(); renderSheet(); };
  $("btnPre").onclick = () => { settings.preflight = !settings.preflight; flush(); renderSheet(); };
  $("btnForget").onclick = () => { settings.samples = {}; settings.edits = []; flush(); renderSheet(); };
  $("inKey").oninput = e => { settings.apiKey = e.target.value.replace(/\s+/g, ""); save(); };
  $("btnFast").onclick = () => { settings.fast = !settings.fast; flush(); renderSheet(); };
  $("inMemo").oninput = e => { settings.memo = e.target.value; save(); };
  $("btnTest").onclick = async () => {
    flush(); $("shStatus").textContent = "確かめています…";
    try { await api("threads", { box:"INBOX", limit:1 });
      $("shStatus").textContent = connected() ? "つながりました。" : "未接続です。URL と合言葉を入れてください。";
      load();
    } catch(e){ $("shStatus").textContent = "つながりませんでした。" + e.message; }
  };
  $("addTerm").onclick = () => {
    const from = $("newFrom").value.trim(), to = $("newTo").value.trim();
    if(!from || !to) return;
    if(!Array.isArray(settings.terms)) settings.terms = [];
    settings.terms.push({ from, to });
    armedTerm = null; rerender();
  };
  $("shScroll").querySelectorAll("[data-delterm]").forEach(b => b.onclick = () => {
    const i = +b.dataset.delterm;
    if(armedTerm !== i){ armedTerm = i; renderSheet(); return; }
    settings.terms.splice(i, 1);
    armedTerm = null; rerender();
  });
  $("addIntent").onclick = () => {
    const label = $("newLabel").value.trim(); if(!label) return;
    settings.intents.push({ id:"c"+Date.now(), label, hint:$("newHint").value.trim()||label });
    armedDelete = null; rerender(); renderChips();
  };
  $("shScroll").querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const id = b.dataset.del;
    if(armedDelete !== id){ armedDelete = id; renderSheet(); return; }
    settings.intents = settings.intents.filter(i => i.id !== id);
    armedDelete = null; rerender(); renderChips();
  });
  $("btnExport").onclick = () => {
    flush();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(settings,null,2)], {type:"application/json"}));
    a.download = "mail-settings-" + new Date().toISOString().slice(0,10) + ".json";
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    $("shStatus").textContent = "書き出しました。";
  };
  $("btnImport").onclick = () => {
    const f = document.createElement("input"); f.type = "file"; f.accept = "application/json,.json";
    f.onchange = () => {
      const file = f.files && f.files[0]; if(!file) return;
      const rd = new FileReader();
      rd.onload = () => {
        const d = migrate(rd.result);
        if(!d){ $("shStatus").textContent = "読み込めませんでした。書き出したファイルを選んでください。"; return; }
        settings = d; flush(); renderSheet(); renderChips();
        refreshSegs(); load();
        $("shStatus").textContent = "読み込みました。";
      };
      rd.readAsText(file);
    };
    f.click();
  };
}

// 新しい版が出ていたら自分で入れ替わる。手で開き直さなくてよくする。
async function checkUpdate(){
  try{
    const r = await fetch("version.json?nc=" + Date.now(), { cache: "no-store" });
    const v = (await r.json()).build;
    if(!v || v === BUILD) return;
    let tried = null;
    try { tried = sessionStorage.getItem("upd"); } catch(e){}
    if(tried === v){
      banner("新しい版 " + v + " が出ています。反映されないときはタブを閉じて開き直してください。");
      return;
    }
    try { sessionStorage.setItem("upd", v); } catch(e){}
    location.replace(location.pathname + "?b=" + encodeURIComponent(v));
  }catch(e){}
}
checkUpdate();
pullState();
setTimeout(offerDraft, 1200);
document.addEventListener("visibilitychange", () => {
  if(document.hidden) return;
  checkUpdate();
  pullState();
});

// 画面に戻ったときと、開いている間は1分ごとに受信箱を取り直す
let refreshTimer = null;
function autoRefresh(){
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    if(!document.hidden && connected() && currentBox === "INBOX") load();
  }, 120000);
}
document.addEventListener("visibilitychange", () => { if(!document.hidden && connected() && currentBox === "INBOX") load(); });
addEventListener("pageshow", () => { if(connected()) load(); });
autoRefresh();

// 一覧を下へ引いて更新する
;(function(){
  const sc = $("listScroll"), hint = $("pullHint");
  let y0 = null, ready = false;
  sc.addEventListener("touchstart", e => {
    y0 = (sc.scrollTop <= 0 && e.touches.length === 1) ? e.touches[0].clientY : null;
    ready = false;
  }, { passive:true });
  sc.addEventListener("touchmove", e => {
    if(y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if(dy <= 0 || sc.scrollTop > 0){ hint.hidden = true; sc.style.transform = ""; return; }
    ready = dy > 70;
    hint.hidden = false;
    hint.textContent = ready ? "離すと更新" : "引いて更新";
    sc.style.transform = "translateY(" + Math.min(dy * 0.4, 56) + "px)";
  }, { passive:true });
  const end = () => {
    if(y0 === null) return;
    y0 = null;
    hint.hidden = true;
    sc.style.transition = "transform .18s";
    sc.style.transform = "";
    setTimeout(() => { sc.style.transition = ""; }, 220);
    if(ready){ ready = false; load({ force:true }); }
  };
  sc.addEventListener("touchend", end, { passive:true });
  sc.addEventListener("touchcancel", end, { passive:true });
})();

// 右へスワイプで一覧に戻る
;(function(){
  let x0 = null, y0 = 0, t0 = 0;
  const r = $("reader");
  r.addEventListener("touchstart", e => {
    if(e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive:true });
  r.addEventListener("touchend", e => {
    if(x0 === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(dx > 70 && Math.abs(dy) < 60 && Date.now() - t0 < 700 &&
       document.body.classList.contains("reading")){
      document.body.classList.remove("reading");
      updateDock();
    }
  }, { passive:true });
})();

addEventListener("keydown", e => {
  if(e.key === "Escape"){ closeCompose(); closeSheet(); closePeople(); closeCal(); }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase() === "n"){ e.preventDefault(); openCompose(); }
});

refreshSegs();
autogrow();
applyFs();
updateDock();
renderFilters();
renderReader();
load();
</script>
